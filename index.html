<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clench Tracker</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #000; color: #fff; overflow: hidden; }
        #app-button { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; border: none; cursor: pointer; transition: background 0.2s; background: #111; }
        .active { background: #003311 !important; }
        .alert-80m { background: #4a3b00 !important; }
        h1 { font-size: 2rem; margin: 0 0 10px 0; color: #ff3b30; }
        .active h1 { color: #34c759; }
        .alert-80m h1 { color: #ffcc00; }
        #distance { font-size: 4.5rem; font-weight: bold; margin: 15px 0; font-variant-numeric: tabular-nums; }
        p { font-size: 1.1rem; color: #8e8e93; margin: 0; text-align: center; padding: 0 15px; }
    </style>
</head>
<body>

    <button id="app-button" onclick="toggleTracking()">
        <h1 id="status">TRACKING OFF</h1>
        <div id="distance">0.0 m</div>
        <p id="instruction">Clench fist to START</p>
    </button>

    <script>
        let isTracking = false;
        let watchId = null;
        let lastPosition = null;
        let totalDistance = 0;
        let lastHapticDistance = 0;
        let hasTriggered80m = false;

        const button = document.getElementById('app-button');
        const statusText = document.getElementById('status');
        const distanceDisplay = document.getElementById('distance');
        const instructionText = document.getElementById('instruction');

        function toggleTracking() {
            if (navigator.vibrate) navigator.vibrate(100);

            if (!isTracking) {
                isTracking = true;
                button.classList.add('active');
                statusText.innerText = "TRACKING ACTIVE";
                instructionText.innerText = "Clench fist to STOP & RESET";
                
                if (navigator.geolocation) {
                    watchId = navigator.geolocation.watchPosition(updateLocation, handleError, {
                        enableHighAccuracy: true,
                        maximumAge: 0,
                        timeout: 5000
                    });
                }
            } else {
                isTracking = false;
                button.classList.remove('active');
                button.classList.remove('alert-80m');
                statusText.innerText = "TRACKING OFF";
                instructionText.innerText = "Clench fist to START";
                
                if (watchId) navigator.geolocation.clearWatch(watchId);
                
                totalDistance = 0;
                lastHapticDistance = 0;
                hasTriggered80m = false;
                lastPosition = null;
                distanceDisplay.innerText = "0.0 m";
            }
        }

        function updateLocation(position) {
            if (!isTracking || position.coords.accuracy > 15) return;

            if (lastPosition) {
                const lat1 = lastPosition.coords.latitude;
                const lon1 = lastPosition.coords.longitude;
                const lat2 = position.coords.latitude;
                const lon2 = position.coords.longitude;

                const deltaDistance = haversineDistance(lat1, lon1, lat2, lon2);
                totalDistance += deltaDistance;
                distanceDisplay.innerText = totalDistance.toFixed(1) + " m";

                if (totalDistance >= 80.0 && !hasTriggered80m) {
                    hasTriggered80m = true;
                    button.classList.add('alert-80m');
                    statusText.innerText = "80m TARGET HIT";
                    if (navigator.vibrate) {
                        navigator.vibrate([1200, 200, 200, 100, 200, 100, 200]);
                    }
                    lastHapticDistance = 80;
                } 
                else if (totalDistance - lastHapticDistance >= 10.0) {
                    if (navigator.vibrate) {
                        navigator.vibrate([250, 150, 250]);
                    }
                    lastHapticDistance = Math.floor(totalDistance / 10) * 10;
                }
            }
            lastPosition = position;
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function handleError(error) {
            console.warn("GPS Error: " + error.message);
        }

        window.onload = function() { 
            toggleTracking(); 
        };
    </script>
</body>
</html>
